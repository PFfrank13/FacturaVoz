name: facturavoz
description: FacturaVoz - facturación por voz (Android, iOS y Web).
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  record: ^6.0.0
  http: ^1.2.2
  http_parser: ^4.0.2
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  cross_file: ^0.3.4+2
  url_launcher: ^6.3.1
  file_picker: ">=8.1.0 <11.0.0"
  intl: any
  local_auth: ">=2.3.0 <3.0.0"
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  # Negocio Pro: fotos de comprobantes/constancias y respuesta hablada del Copiloto
  image_picker: ^1.1.2
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/fonts/Inter-LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
