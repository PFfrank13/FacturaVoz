name: facturavoz
description: FacturaVoz - facturación por voz (Android, iOS y Web).
publish_to: "none"
version: 3.5.0+10

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  dynamic_notification_island:
    path: packages/dynamic_notification_island
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  record: ^6.0.0
  http: ^1.2.2
  http_parser: ^4.0.2
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  cross_file: ^0.3.4+2
  url_launcher: ^6.3.1
  file_picker: ">=8.1.0 <11.0.0"
  intl: any
  local_auth: ">=2.3.0 <3.0.0"
  flutter_secure_storage: ^10.3.4
  crypto: ^3.0.3
  # Negocio Pro: fotos de comprobantes/constancias y respuesta hablada del Copiloto
  image_picker: ^1.1.2
  flutter_tts: ^4.2.5
  audioplayers: ^6.1.0                 # reproducir la voz premium (MP3 del servidor); si falla, voz del teléfono
  # v2.0: Excel (.xlsx) en el teléfono (ya viene con el paquete pdf; se declara para usarlo directamente)
  archive: ">=3.4.0 <5.0.0"
  # v2.0 (todas gratuitas y de código abierto):
  barcode: ">=2.2.8 <3.0.0"            # QR nivel Q como imagen para ticketeras sin QR nativo (ya lo trae pdf)
  mobile_scanner: ">=6.0.0 <8.0.0"     # leer códigos de barras con la cámara
  print_bluetooth_thermal: ^1.1.6      # ticketeras Bluetooth ESC/POS (Android; iPhone BLE)
  permission_handler: ^11.3.1          # permiso "Dispositivos cercanos" (Bluetooth) en Android 12+
  quick_actions: ^1.1.0                # atajos al mantener presionado el ícono
  flutter_map: ">=7.0.2 <9.0.0"        # mapa del cliente (OpenStreetMap, sin clave)
  latlong2: ^0.9.1
  geolocator: ">=13.0.0 <15.0.0"       # "estoy aquí": guardar la ubicación del cliente/trabajo

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  web_socket: ^1.0.1
  web_socket_channel: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/fonts/Inter-LICENSE.txt
    - assets/fonts/DMSerifText-LICENSE.txt
    - assets/branding/
    - assets/payments/
    - assets/photos/
    - assets/demo/
  fonts:
    - family: DM Serif Text
      fonts:
        - asset: assets/fonts/DMSerifText-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
