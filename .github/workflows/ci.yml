name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Verificar árbol completo de dependencias del backend (producción)
        run: npm ls --omit=dev --all
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run audit:test
      - run: node scripts/audit-gate.mjs
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci.ci.ci

  database:
    # PostgreSQL 17 (la versión del proyecto Supabase). Instalación nueva + actualización desde el estado real de producción.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -Atc "select version()"
      - name: Migraciones desde cero + pruebas SQL
        run: bash backend/supabase/tests/local/run_all.sh
      - name: Actualización desde producción (local → Hub, stock, suscripción, RLS)
        run: bash backend/supabase/tests/upgrade/run_upgrade.sh

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fijado: Flutter 3.50 deprecó package:flutter/material.dart (paso a material_ui) y flutter analyze
          # falla con 95 avisos en TODOS los archivos. Migrar a material_ui es una tarea aparte.
          flutter-version: 3.47.9
          cache: true
      # Si ya subiste android/ ios/ web/ al repo, estos dos pasos no cambian nada.
      - run: flutter create --org com.example --project-name facturavoz --platforms=android,ios,web .
      - run: dart run tool/post_create.dart
      - name: Fase 5 - probar política de entrega sin exponer secretos
        run: python3 -m unittest discover -s ../tools/release -p 'test_*.py'
      - name: Fase 5 - bloquear release inseguro desde el código
        run: python3 ../tools/release/preflight.py --source --project .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Probar animación y accesibilidad de la isla
        run: flutter test packages/dynamic_notification_island/test
      # Renders de widgets Flutter reales para revisar el diseño en el PR.
      - name: Exportar vistas Flutter Luxe
        run: flutter test tool/visual_preview.dart --update-goldens
      - name: Exportar vistas reales de carrito y cobro
        run: flutter test tool/visual_checkout_preview.dart --update-goldens
      - name: Capturar rutas Signature con datos de prueba locales
        run: flutter test test/visual/signature_preview.dart --update-goldens
      - uses: actions/upload-artifact@v7
        with:
          name: facturavoz-luxe-flutter-previews
          path: app/tool/previews/**/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Fase 5 - rechazar APK release sin firma privada en CI
        shell: bash
        run: |
          set +e
          flutter build apk --release --dart-define=SUPABASE_URL=https://example.supabase.co --dart-define=SUPABASE_ANON_KEY=ci --dart-define=API_BASE_URL=https://example.vercel.app > "$RUNNER_TEMP/fase5-unsigned-release.log" 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "ERROR: Android permitió compilar release sin keystore privado."
            exit 1
          fi
          if ! grep -q "Firma release bloqueada:" "$RUNNER_TEMP/fase5-unsigned-release.log"; then
            echo "ERROR: El release falló por una causa distinta de la guarda de firma."
            tail -n 60 "$RUNNER_TEMP/fase5-unsigned-release.log"
            exit 1
          fi
          echo "OK: Gradle bloqueó expresamente la compilación release sin firma privada."
      - run: >
          flutter build web --release
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=ci
          --dart-define=API_BASE_URL=https://example.vercel.app
      # CI cannot access the private FacturaVoz signing keystore.
      # Validate Android source with an unsigned-for-distribution DEBUG build.
      # Signed release APK/AAB remains a separate, mandatory gate on the signing host.
      - run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=ci
          --dart-define=API_BASE_URL=https://example.vercel.app
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/tool/browser_qa/package-lock.json
      - name: Compilar la aplicación de prueba con datos locales y CanvasKit incluido
        run: flutter build web --release --no-pub --no-wasm-dry-run --no-web-resources-cdn --output=build/browser-qa --target=tool/browser_qa/main.dart
      - name: Recorrer Inicio, notificaciones y venta con Playwright
        working-directory: app/tool/browser_qa
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium webkit
          npm test
