name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node scripts/audit-gate.mjs
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci.ci.ci

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fijado: Flutter 3.50 deprecó package:flutter/material.dart (paso a material_ui) y flutter analyze
          # falla con 95 avisos en TODOS los archivos. Migrar a material_ui es una tarea aparte.
          flutter-version: 3.47.9
          cache: true
      # Si ya subiste android/ ios/ web/ al repo, estos dos pasos no cambian nada.
      - run: flutter create --org com.example --project-name facturavoz --platforms=android,ios,web .
      - run: dart run tool/post_create.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: >
          flutter build web --release
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=ci
          --dart-define=API_BASE_URL=https://example.vercel.app
      # CI cannot access the private FacturaVoz signing keystore.
      # Validate Android source with an unsigned-for-distribution DEBUG build.
      # Signed release APK/AAB remains a separate, mandatory gate on the signing host.
      - run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=ci
          --dart-define=API_BASE_URL=https://example.vercel.app
