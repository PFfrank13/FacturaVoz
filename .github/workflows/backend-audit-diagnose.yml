name: Diagnose backend dependency advisories

on:
  push:
    branches:
      - fix/backend-audit-remediation-20261117
    paths:
      - '.github/workflows/backend-audit-diagnose.yml'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/scripts/audit-gate.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Print original audited advisories with paths and suggested fixes
        run: |
          npm audit --json > /tmp/backend-before.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/backend-before.json','utf8'));
          for (const [name, v] of Object.entries(report.vulnerabilities ?? {})) {
            if (!['high','critical'].includes(v.severity)) continue;
            console.log(JSON.stringify({
              name, severity:v.severity, isDirect:v.isDirect,
              range:v.range, nodes:v.nodes, fixAvailable:v.fixAvailable,
              via:(v.via ?? []).map(x=>typeof x==='string'?x:
                {source:x.source,name:x.name,title:x.title,url:x.url,range:x.range,severity:x.severity})
            }));
          }
          NODE
      - name: Try safe compatible lockfile-only audit updates
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm audit --json > /tmp/backend-after.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/backend-after.json','utf8'));
          console.log('AFTER COMPATIBLE FIX:');
          for (const [name,v] of Object.entries(report.vulnerabilities ?? {})) {
            if (!['high','critical'].includes(v.severity)) continue;
            console.log(JSON.stringify({name,severity:v.severity,fixAvailable:v.fixAvailable,via:(v.via??[]).filter(x=>typeof x==='object').map(x=>x.url)}));
          }
          NODE
      - name: Verify install and test compatibility with candidate lock
        run: |
          npm ci --no-audit --no-fund
          npm test -- --run
