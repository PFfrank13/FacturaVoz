version: 2
updates:
  # Detectar y proponer parches del backend automáticamente cuando upstream
  # publique una versión segura. Nunca actualizar lockfile a ciegas en main.
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
  # Flutter/Dart: actualizar pubspec.yaml y lockfile mediante PRs revisables.
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:20"
      timezone: "America/Lima"
    open-pull-requests-limit: 3

  # Vigilar también las acciones de CI y del emulador (no autofusionar).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:40"
      timezone: "America/Lima"
    open-pull-requests-limit: 3
